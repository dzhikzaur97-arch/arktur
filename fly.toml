# Fly.io: fly launch --no-deploy → fly volumes create arktur_data --size 1 → fly deploy
app = "arktur"
primary_region = "fra"

[env]
  PORT = "8080"
  DB_FILE = "/data/db.json"

[[mounts]]
  source = "arktur_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
