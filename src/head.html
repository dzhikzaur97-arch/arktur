<title>Тренажёрный гид «Рычаг»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Тёмный «приборный» экран как в биомеханических симуляторах: свечение мышц на графитовом фоне, оранжевый — сила. Одна колонка на телефоне, две на широком. */
:root{
  --bg:#0c0d12; --panel:#14161e; --panel2:#1b1e29; --line:#272b39; --fg:#eef0f6; --mute:#8f95ab; --dim:#5d6377;
  --force:#ff7a2f; --ok:#3fd99a; --warn:#ffbe4d; --bad:#ff4f63;
  --f-display:'Unbounded','Golos Text',system-ui,sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--force);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(12,13,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in,.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.02em;text-decoration:none;display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.top-in small{color:var(--mute);font-size:12.5px;line-height:1.25}
.wrap{padding-block:18px 28px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(15,16,22,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;text-decoration:none;color:var(--mute);font-size:12px;font-weight:500}
.nav a svg{width:22px;height:22px}
.nav a.on{color:var(--fg)}
.nav a.on svg{color:var(--force)}

h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,5.6vw,32px);line-height:1.15;margin:0 0 8px;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;font-weight:600}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 12px;font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:0 0 6px;font-weight:600}
.intro p,.mhead p,.aka{color:var(--mute);margin:0;max-width:62ch}
.intro{margin-bottom:16px}
.note{color:var(--mute);font-size:13.5px}

/* карта тела */
.bodymap{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:420px;margin:8px auto 18px}
.fig{margin:0;text-align:center}
.fig svg{width:100%;height:auto;max-height:380px}
.fig figcaption{font-size:12px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.sil>*{fill:var(--panel2);stroke:#2f3446;stroke-width:.8}
.mz>*{fill:var(--c);opacity:var(--o);transition:opacity .15s,filter .15s}
.mz:not(.static){cursor:pointer}
.mz:not(.static):hover>*,.mz:not(.static):focus-visible>*{opacity:1;filter:drop-shadow(0 0 4px var(--c))}
.mz:focus-visible{outline:none}

.groups{display:grid;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.mchip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);text-decoration:none;font-size:14px}
.mchip i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.mchip span{font-family:var(--f-mono);font-size:11.5px;color:var(--dim)}
.mchip:hover{border-color:var(--c)}

/* список */
.search{display:block;margin-bottom:10px}
.search input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:16px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.cat{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mute);font-size:13.5px;cursor:pointer}
.cat.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line);text-decoration:none}
.row:hover b{color:#fff}
.rowmain{flex:1;min-width:0}
.rowtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rowtop b{font-weight:600;font-size:15.5px}
.rowsub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--mute);font-size:13px;margin-top:2px}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.role{font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--panel2);color:var(--fg)}
.role.r3{background:rgba(63,217,154,.14);color:var(--ok)}
.tip{margin:6px 0 0;font-size:13.5px;color:#c9cddb;max-width:62ch}
.chev{color:var(--dim);font-size:22px}
.simtag{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--force);border:1px solid rgba(255,122,47,.45);border-radius:6px;padding:1px 6px}
.empty{color:var(--mute);padding:20px 0}

.back{background:none;border:0;color:var(--mute);padding:4px 0;margin-bottom:8px;cursor:pointer;font-size:15px}
.mhead{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:12px;align-items:center;margin-bottom:18px}
.mhead h1{color:var(--c)}
.mhead .bodymap{margin:0}
@media (max-width:520px){.mhead{grid-template-columns:minmax(0,1fr) 120px}}

/* экран тренажёра */
.exhead{margin-bottom:12px}
.aka{font-size:13.5px}
.target{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.tlabel{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600}
.tchip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font-size:14px}
.tchip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tchip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--panel));box-shadow:0 0 0 1px var(--c) inset}
.exgrid{display:grid;gap:16px}
@media (min-width:900px){.exgrid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}.col-a{position:sticky;top:70px}}
.col-a,.col-b{min-width:0;display:flex;flex-direction:column;gap:16px}

.sim{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stage{position:relative;background:radial-gradient(120% 90% at 50% 30%,#171a25 0%,#0e1016 70%)}
#cv{display:block;width:100%;touch-action:pan-y}
.stag{position:absolute;left:10px;top:8px;font-family:var(--f-mono);font-size:10.5px;color:var(--dim);letter-spacing:.03em}
.coach{position:absolute;right:10px;top:8px;display:flex;align-items:baseline;gap:8px;font-size:13px;background:rgba(12,13,18,.7);padding:4px 10px;border-radius:999px}
.coach .rep{font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.coach b{font-weight:600}
.coach .sec2{font-family:var(--f-mono);font-size:11px;color:var(--force)}
.transport{display:flex;align-items:center;gap:12px;padding:12px 14px 4px}
.play{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--force);color:#140a04;font-size:14px;font-weight:700;cursor:pointer}
.scrub{flex:1;min-width:0}
.ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);gap:8px}
.ends span:last-child{text-align:right}
.tempo{display:flex;align-items:center;gap:6px;padding:6px 14px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.tempo button{font-family:var(--f-mono);font-size:12px;padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
.tempo button.on{color:var(--fg);border-color:var(--fg)}
.tempo .hint{font-size:11.5px;color:var(--dim)}

input[type=range]{width:100%;accent-color:var(--force);height:28px;margin:0}

.fcall{border-left:3px solid var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 10%,transparent),transparent 70%);padding:12px 14px;border-radius:4px 12px 12px 4px}
.fcall .eyebrow{color:var(--c)}
.fcall p{margin:0 0 6px}
.stline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:#c9cddb;margin-top:6px}
.stline.mute{color:var(--mute)}
.big{font-family:var(--f-mono);font-size:26px;font-weight:600;line-height:1}
.ok{color:var(--ok);display:inline-flex;align-items:center;gap:5px}
.warn{color:var(--warn)}
.pbtn{font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--c,var(--line));background:color-mix(in srgb,var(--c,#888) 14%,transparent);cursor:pointer}
.pbtn.sm{padding:5px 10px}
.pbtn.reset{--c:#8f95ab;background:transparent}

.readout,.pbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.bar{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 3.2em;align-items:center;gap:10px;font-size:13.5px;margin-bottom:8px}
.bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c9cddb}
.bar.tg .bn{color:var(--fg);font-weight:600}
.bt{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--c);border-radius:99px;box-shadow:0 0 10px var(--c);transition:width .25s}
.bv{font-family:var(--f-mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.prof{margin:14px 0 4px}
.ph{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-bottom:4px}
.ph b{color:var(--fg);font-weight:500}
.prof svg{width:100%;height:70px;display:block}
.prof .ax{stroke:var(--line);stroke-width:1}
.prof .mk{stroke:var(--fg);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-dasharray:3 3}
.w{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;margin-top:8px;font-size:13.5px}
.w p{margin:0}
.wi{flex:none;margin-top:1px}
.w.ok{background:rgba(63,217,154,.08);color:#bdeed8}.w.ok .wi{color:var(--ok)}
.w.warn{background:rgba(255,190,77,.08);color:#f5dfb5}.w.warn .wi{color:var(--warn)}
.w.bad{background:rgba(255,79,99,.1);color:#ffd0d6}.w.bad .wi{color:var(--bad)}

.param{margin-bottom:10px}
.plabel{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:#c9cddb}
.plabel output{font-family:var(--f-mono);font-size:12.5px;color:var(--force);text-align:right}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg button{flex:1;min-width:120px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer;font-size:13px}
.seg button.on{border-color:var(--force);color:var(--fg);background:rgba(255,122,47,.1)}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--mute)}
.presets span{width:100%}

.nosim{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.nosim .bodymap{max-width:340px}

.texts{display:grid;gap:22px;margin-top:22px}
@media (min-width:900px){.texts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.txt ol{margin:0;padding-left:1.3em;display:grid;gap:7px;max-width:62ch}
.txt li::marker{font-family:var(--f-mono);color:var(--dim);font-size:12px}
.txt.err li::marker{color:var(--bad)}
.focus{display:grid;gap:8px}
.fitem{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.fitem b{color:var(--c);font-size:14px}
.fitem p{margin:3px 0 0;font-size:14px;color:#c9cddb}
.fitem.on{border-color:var(--c)}

.how{display:grid;gap:12px;max-width:640px}
.howrow{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.howrow div{min-width:0}
.sw{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.sw.force{background:linear-gradient(180deg,transparent 45%,var(--force) 45%,var(--force) 55%,transparent 55%)}
.sw.arm{background:linear-gradient(90deg,#ff47b5 0 50%,#a98bff 50%);height:6px;margin-top:14px;border-radius:3px}
.sw.glow{background:radial-gradient(circle,#ff47b5 0,rgba(255,71,181,.35) 45%,transparent 70%)}
.sw.handle{background:radial-gradient(circle,#ff5a2a 0 45%,transparent 47%)}
.sw.skull{color:var(--bad)}
.btn{display:inline-block;justify-self:start;padding:11px 16px;border-radius:12px;background:var(--force);color:#140a04;text-decoration:none;font-weight:600}

/* --- v2 --- */
.topc{margin-left:auto}
.tconc{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--warn);text-decoration:none;border:1px solid rgba(255,190,77,.35);padding:4px 9px;border-radius:999px}
.tconc svg{width:13px;height:13px}
.mt{margin-top:22px}
.ico{flex:none;width:52px;height:39px;border-radius:10px;background:var(--panel2);padding:3px}
.ico.big{width:76px;height:57px;border-radius:12px}
.ico .im>*{fill:none;stroke:#5f667c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico .im circle{fill:#2b3040}
.ico .ib path{fill:none;stroke:#e6e9f3;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ico .ib circle{fill:#e6e9f3}
.favdot{color:#ffd23f;font-size:13px}
.cb{font-size:11px;padding:1px 7px;border-radius:6px;font-weight:500}
.cb.avoid{background:rgba(255,79,99,.14);color:#ff8d9b}
.cb.care{background:rgba(255,190,77,.12);color:var(--warn)}
.exhead{display:flex;gap:14px;align-items:flex-start}
.exht{flex:1;min-width:0}
.favbtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--mute);cursor:pointer;display:grid;place-items:center}
.favbtn.on{color:#ffd23f;border-color:rgba(255,210,63,.5)}
.conc{margin-bottom:12px}
.conc .w{margin-top:0;margin-bottom:8px}
.alts{margin-top:4px!important;font-size:13px}
.alts a{color:var(--fg)}
.btn.sm{padding:8px 12px;font-size:13.5px;margin-top:10px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.wide{display:block;width:100%;text-align:center;margin-top:14px;border:0;cursor:pointer;font-size:15.5px}
.btn.ghost.wide{border:1px solid var(--line)}
.btn[disabled]{opacity:.35}
.link{display:inline-block;color:var(--mute);background:none;border:0;padding:8px 0;cursor:pointer;font-size:14px;text-decoration:none}
.link:hover{color:var(--fg)}
.link.danger{color:#ff8d9b}
.fsbtn{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(12,13,18,.75);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.stag a{color:var(--mute)}
.stag{max-width:calc(100% - 200px);line-height:1.4}
.sim.fs{position:fixed;inset:0;z-index:60;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:auto}
body.noscroll{overflow:hidden}
.srcs{display:grid;gap:8px}
.src{display:grid;gap:3px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-decoration:none}
.src b{font-size:14px;font-weight:600}
.src span{font-size:13.5px;color:#c9cddb}
.src small{font-size:12px;color:var(--dim)}
.hist .spark{width:100%;height:34px;display:block;margin-bottom:6px}
.hrows{display:grid;gap:4px}
.hrow{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--mute)}
.hrow b{color:var(--fg);font-family:var(--f-mono);font-size:12.5px;font-weight:500;text-align:right}
.hrow a{color:var(--fg)}
.sug{margin:10px 0 0;font-size:13.5px;color:#ffd7bd;background:rgba(255,122,47,.08);padding:8px 10px;border-radius:10px}
.photobtn{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px dashed rgba(255,122,47,.5);background:rgba(255,122,47,.06);cursor:pointer;margin-bottom:12px}
.photobtn svg{flex:none;color:var(--force)}
.photobtn span{display:grid}
.photobtn small{color:var(--mute);font-size:12.5px}
.thinking{color:var(--mute);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.4}}
.phcard{margin-bottom:14px}
/* тренировка */
.plan{display:grid;gap:8px}
.pitem{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.pitem b{font-size:15px}
.pitem .rowsub{display:block}
.pact{display:flex;gap:6px}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
.dotc{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:2px}
.wact{display:grid;gap:12px}
.whead .eyebrow{margin-bottom:8px}
.wprog{display:flex;gap:4px}
.wprog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.wprog i.dn{background:var(--ok)}
.wprog i.cur{background:var(--force)}
.wcard{display:flex;gap:12px;align-items:center}
.wcard h1{font-size:clamp(19px,5vw,26px);margin:0 0 4px}
.lastbox{padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:grid;gap:4px}
.lastbox span{font-size:12.5px;color:var(--mute)}
.lastbox b{font-family:var(--f-mono);font-weight:500}
.setin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:grid;gap:6px;font-size:12.5px;color:var(--mute)}
.stepper div{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.stepper button{border:0;background:var(--panel2);color:var(--fg);font-size:22px;cursor:pointer;height:54px}
.stepper input{border:0;background:transparent;color:var(--fg);text-align:center;font-family:var(--f-mono);font-size:22px;font-weight:600;min-width:0;width:100%}
.sets{display:flex;flex-wrap:wrap;gap:6px}
.setc{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12.5px;padding:5px 6px 5px 10px;border-radius:999px;background:rgba(63,217,154,.1);color:#bdeed8}
.setc button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:12px}
.rest{display:flex;align-items:center;gap:14px;padding:12px;border-radius:16px;background:var(--panel);border:1px solid var(--force);flex-wrap:wrap}
